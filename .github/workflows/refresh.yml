name: refresh telemetry

on:
  schedule:
    - cron: "23 * * * *"   # hourly
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python assets/src/build.py --live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The live panels live on their own branch: main's history stays yours alone, and commits
      # off the default branch don't count as contributions (no feedback loop).
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output"
          if curl -sf "$raw/telemetry.svg" | cmp -s - assets/telemetry.svg &&
             curl -sf "$raw/ops.svg" | cmp -s - assets/ops.svg; then echo "unchanged"; exit 0; fi
          mkdir out && cp assets/telemetry.svg assets/ops.svg out/ && cd out
          git init -q -b output
          git config user.name "Nithin G"
          git config user.email "thangamnithin1980@gmail.com"
          git add telemetry.svg ops.svg && git commit -qm "live panels"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
