name: refresh telemetry

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour, away from the top-of-hour rush
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      # a push is itself a contribution; give GitHub a moment to count it before reading the totals
      - if: github.event_name == 'push'
        run: sleep 90
      - run: python assets/src/build.py --live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The live panels live on their own branch: main's history stays yours alone, and commits
      # off the default branch don't count as contributions (no feedback loop).
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          if git fetch -q --depth=1 origin output; then
            for f in telemetry ops; do git show "FETCH_HEAD:$f.svg" > "out/$f.svg" 2>/dev/null || rm -f "out/$f.svg"; done
          fi
          changed=0
          for f in telemetry ops; do
            if [ -f "assets/$f.svg" ] && ! cmp -s "assets/$f.svg" "out/$f.svg"; then cp "assets/$f.svg" out/; changed=1; fi
          done
          if [ "$changed" = 0 ]; then echo "panels unchanged"; exit 0; fi
          if [ ! -f out/telemetry.svg ] || [ ! -f out/ops.svg ]; then echo "incomplete panel set; skipping"; exit 0; fi
          cd out
          git init -q -b output
          git config user.name "Nithin G"
          git config user.email "thangamnithin1980@gmail.com"
          git add telemetry.svg ops.svg && git commit -qm "live panels"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
      # Public repos lose scheduled runs after 60 quiet days; re-enabling the workflow resets that clock.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/refresh.yml/enable" || true
