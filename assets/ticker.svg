ermanently.</tspan><tspan fill="#5E5E5E">   ///   </tspan></text><text x="6931.9" y="25" font-family="mr" font-size="12.5"><tspan fill="#A3A3A3">The quieter you become, the more you are able to hear.</tspan><tspan fill="#5E5E5E">   ///   </tspan><tspan fill="#A3A3A3">Nah, I'd hack.</tspan><tspan fill="#5E5E5E">   ///   </tspan><tspan fill="#A3A3A3">Security is a process, not a product. (Bruce Schneier)</tspan><tspan fill="#5E5E5E">   ///   </tspan><tspan fill="#A3A3A3">Amateurs hack systems, professionals hack people. (Bruce Schneier)</tspan><tspan fill="#5E5E5E">   ///   </tspan><tspan fill="#A3A3A3">Hack the planet!</tspan><tspan fill="#5E5E5E">   ///   </tspan><tspan fill="#A3A3A3">If it's connected, it's vulnerable.</tspan><tspan fill="#5E5E5E">   ///   </tspan><tspan fill="#A3A3A3">Root is not a privilege. It's a responsibility.</tspan><tspan fill="#5E5E5E">   ///   </tspan><tspan fill="#A3A3A3">I don't hack systems. I understand them.</tspan><tspan fill="#5E5E5E">   ///   </tspan><tspan fill="#A3A3A3">Break things ethically. Fix them permanently.</tspan><tspan fill="#5E5E5E">   ///   </tspan></text></g></g></svg>